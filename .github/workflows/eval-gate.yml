# CI pipeline for Production RAG
#
# Three jobs:
#   lint           — offline: ruff + pytest (no secrets, no services required)
#   acl-isolation  — online: pgvector/qdrant service containers for tenant security tests
#   eval           — online: ingest → run experiment → gate against Langfuse baseline run
#
# REQUIRED SECRETS: `NVIDIA_API_KEY` plus `LANGFUSE_HOST`, `LANGFUSE_PUBLIC_KEY`,
# `LANGFUSE_SECRET_KEY` in repo Settings → Secrets → Actions.
# The eval job will fail without them.  The lint job runs unconditionally.
#
# PREREQUISITE for the eval gate: a Langfuse dataset run named "baseline" must
# exist for the "hotpotqa" dataset (seeded via `eval.dataset_cli` and produced
# by `eval.experiment --run-name baseline`).  See docs/architecture.md for
# instructions on bootstrapping the baseline run.

name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: lint + offline tests — no secrets, no services needed
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Offline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Offline test suite
        # These tests use fakes/mocks; no NVIDIA_API_KEY or running services required.
        run: uv run pytest -q

  # ---------------------------------------------------------------------------
  # Job 2: acl-isolation — pgvector and qdrant security test suite
  # ---------------------------------------------------------------------------
  acl-isolation:
    name: Live Database ACL Isolation Tests
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run live database isolation checks
        env:
          RAG_REQUIRE_LIVE_STORES: "1"
          VECTOR_STORE: "qdrant"
          PG_DSN: "postgresql://rag:rag@localhost:5432/rag"
          QDRANT_URL: "http://localhost:6333"
        run: |
          uv run pytest tests/test_stores_acl.py tests/test_multitenant_isolation.py -v

  # ---------------------------------------------------------------------------
  # Job 3: eval gate — requires NVIDIA_API_KEY and the Qdrant service
  # ---------------------------------------------------------------------------
  eval:
    name: Eval Gate (hotpotqa / full pipeline)
    runs-on: ubuntu-latest
    if: github.repository == 'ShreytamGoyal/production-rag' && secrets.NVIDIA_API_KEY != ''

    # Qdrant service container — CI uses VECTOR_STORE=qdrant (the default)
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        # Qdrant has no readiness probe endpoint we can health-check cheaply;
        # the ingest step will retry automatically via tenacity.
        options: >-
          --health-cmd "curl -sf http://localhost:6333/healthz || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # ── Provider: NIM via OpenAI-compatible SDK ─────────────────────────────
      # NVIDIA_API_KEY is the only credential needed. All component keys fall
      # back to it via core/config.py Settings._fill_key_fallbacks().
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      # ── Langfuse: dataset/run storage + gate readback ───────────────────────
      LANGFUSE_ENABLED: "true"
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

      # ── Vector store (keep Qdrant; avoids the Postgres service overhead) ────
      VECTOR_STORE: qdrant
      QDRANT_URL: http://localhost:6333

      # ── Embeddings: NIM bge-m3 ──────────────────────────────────────────────
      # These match the defaults in core/config.py but are set explicitly so
      # that a config-default change doesn't silently alter CI behaviour.
      EMBED_BASE_URL: https://integrate.api.nvidia.com/v1
      EMBED_MODEL: baai/bge-m3
      EMBED_DIMENSION: "1024"

      # ── Generation: NIM Llama-3.3-70b-instruct ─────────────────────────────
      GEN_PROVIDER: openai
      GEN_BASE_URL: https://integrate.api.nvidia.com/v1
      GEN_MODEL: meta/llama-3.3-70b-instruct

      # ── LLM judge (backs RAGAS-style metrics + holistic judge) ─────────────
      JUDGE_PROVIDER: openai
      JUDGE_BASE_URL: https://integrate.api.nvidia.com/v1
      JUDGE_MODEL: meta/llama-3.3-70b-instruct

      # ── Reranker: NIM (avoids downloading ~2 GB BGE weights on the runner) ─
      # Uses the same NVIDIA_API_KEY via the fallback in config.py.
      RERANKER: nim
      RERANKER_NIM_MODEL: nvidia/llama-3.2-nv-rerankqa-1b-v2
      RERANKER_NIM_BASE_URL: https://integrate.api.nvidia.com/v1

      # ── Context assembly ───────────────────────────────────────────────────
      CONTEXT_PROVIDER: openai
      CONTEXT_BASE_URL: https://integrate.api.nvidia.com/v1
      CONTEXT_MODEL: meta/llama-3.1-8b-instruct

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      # No NVIDIA key needed for installation.
      - name: Install dependencies
        run: uv sync --all-extras

      # ── Ingest ──────────────────────────────────────────────────────────────
      # REQUIRES NVIDIA_API_KEY (embedding calls to NIM).
      # We call the module directly (not `make ingest`) to pass --limit, which
      # the Makefile target does not support.
      # --limit 50: keeps NIM calls well under the 40 rpm free-tier cap and
      # ensures CI completes in ~5 min.  The committed baseline must be
      # generated against the same --limit 50 fixture (see prerequisite above).
      # --contextual is intentionally OMITTED: it fires one LLM call per chunk
      # (~50 extra calls) and the full pipeline runs correctly without prefixes.
      - name: Ingest fixture corpus (hotpotqa, limit=50)
        run: |
          uv run python -m ingest.run \
            --dataset hotpotqa \
            --limit 50

      # ── Eval ────────────────────────────────────────────────────────────────
      # REQUIRES NVIDIA_API_KEY (generation + judge calls to NIM) and the
      # LANGFUSE_* secrets (the run is registered as a Langfuse dataset run and
      # per-item metrics are pushed as scores, linked to their traces).
      # --fast caps at 15 items (fast_subset), which is sufficient for CI.
      # Per-item: ~15 LLM calls (pipeline + faithfulness + answer_relevancy +
      # context_precision×8 + context_recall + holistic_judge).
      # Total: ~225 LLM calls + ~20 embed calls ≈ 8–12 min wall time at 40 rpm.
      - name: Run eval experiment (full pipeline, fast subset)
        run: |
          uv run python -m eval.experiment \
            --dataset hotpotqa \
            --version full \
            --fast \
            --run-name "ci-${{ github.run_id }}"

      # ── Gate ────────────────────────────────────────────────────────────────
      # Reads per-item scores for the run just produced and the "baseline" run
      # back from Langfuse and applies the configured gate (paired-bootstrap
      # and/or absolute thresholds). Exits 1 (failing the job) on a regression.
      - name: Gate against baseline run
        run: |
          uv run python -m eval.gate \
            --dataset hotpotqa \
            --new-run "ci-${{ github.run_id }}" \
            --baseline-run baseline

  # ---------------------------------------------------------------------------
  # Job 4: Status Gate required check
  # ---------------------------------------------------------------------------
  eval-gate-status:
    name: Gated Status Check
    runs-on: ubuntu-latest
    needs: [lint, acl-isolation, eval]
    if: always()
    steps:
      - name: Check overall gate status
        env:
          LINT_STATUS: ${{ needs.lint.result }}
          ACL_STATUS: ${{ needs.acl-isolation.result }}
          EVAL_STATUS: ${{ needs.eval.result }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          echo "Lint job status: $LINT_STATUS"
          echo "ACL job status: $ACL_STATUS"
          echo "Eval job status: $EVAL_STATUS"

          # 1. Lint or ACL-isolation must never fail
          if [ "$LINT_STATUS" = "failure" ] || [ "$LINT_STATUS" = "cancelled" ]; then
            echo "Error: Lint & Offline Tests failed or was cancelled."
            exit 1
          fi

          if [ "$ACL_STATUS" = "failure" ] || [ "$ACL_STATUS" = "cancelled" ]; then
            echo "Error: Live Database ACL Isolation Tests failed or was cancelled."
            exit 1
          fi

          # 2. Eval check
          if [ "$EVAL_STATUS" = "success" ]; then
            echo "Success: Eval Gate passed."
            exit 0
          elif [ "$EVAL_STATUS" = "failure" ] || [ "$EVAL_STATUS" = "cancelled" ]; then
            echo "Error: Eval Gate failed or was cancelled."
            exit 1
          elif [ "$EVAL_STATUS" = "skipped" ]; then
            # If skipped, check if 'eval-skip-approved' label is present in the PR
            if echo "$PR_LABELS" | grep -q '"name":\s*"eval-skip-approved"'; then
              echo "Passed: Eval job was skipped, and 'eval-skip-approved' label is present."
              exit 0
            else
              echo "Error: Eval job was skipped due to missing secrets (e.g. fork PR), but no 'eval-skip-approved' label was found on the PR."
              exit 1
            fi
          else
            echo "Error: Unknown eval job status: $EVAL_STATUS"
            exit 1
          fi
