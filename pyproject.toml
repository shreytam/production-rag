[project]
name = "production-rag"
version = "0.1.0"
description = "Production-grade RAG: hybrid retrieval + reranking + contextual retrieval, ACL isolation, guardrails, and async PDF-document ingestion."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "anthropic>=0.34",
    "qdrant-client>=1.10",
    "psycopg[binary]>=3.2",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
pii-ner = ["presidio-analyzer>=2.2", "spacy>=3.7"]
rerank-local = ["sentence-transformers>=3.0"]
# python-multipart is required by FastAPI for File()/Form() — i.e. the /documents
# upload endpoint. It was previously satisfied only as a transitive dep of
# streamlit; declare it directly so the upload path cannot break silently.
app = ["fastapi>=0.112", "uvicorn>=0.30", "pyjwt[crypto]>=2.9", "unstructured>=0.15", "arq>=0.26", "python-multipart>=0.0.9"]
obs = ["langfuse>=4"]
# Optional: real redis-vl backend for the semantic cache (Redis 8). Lazily
# imported (cache/_redisvl_backend.py only) so the offline suite and lint stay
# dependency-free; install with `uv sync --extra cache` to enable it.
cache = ["redisvl>=0.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.23", "ruff>=0.6"]
all = [
    "sentence-transformers>=3.0",
    "fastapi>=0.112", "uvicorn>=0.30", "pyjwt[crypto]>=2.9", "python-multipart>=0.0.9",
    "langfuse>=4",
    "redisvl>=0.3",
    "pytest>=8.3", "pytest-asyncio>=0.23", "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "providers", "ingest", "retrieval", "generation", "guardrails", "observability", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
