[project]
name = "production-rag"
version = "0.1.0"
description = "Production-grade RAG: hybrid retrieval + reranking + contextual retrieval, ACL isolation, guardrails, and an eval harness wired into CI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "anthropic>=0.34",
    "qdrant-client>=1.10",
    "psycopg[binary]>=3.2",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=8.5",
]

[project.optional-dependencies]
eval = ["datasets>=2.20", "scipy>=1.13", "pandas>=2.2"]
pii-ner = ["presidio-analyzer>=2.2", "spacy>=3.7"]
rerank-local = ["sentence-transformers>=3.0"]
# python-multipart is required by FastAPI for File()/Form() — i.e. the /documents
# upload endpoint. It was previously satisfied only as a transitive dep of
# streamlit; declare it directly so the upload path cannot break silently.
#
# `unstructured` gates each format behind its own optional dependencies and
# raises ImportError at parse time when they are missing. Everything advertised
# in Settings.ingest_allowed_types must therefore be installed here, or the API
# accepts uploads it can never parse (tests/test_document_parser.py asserts
# every advertised type actually parses):
#   .docx            -> python-docx
#   application/pdf  -> pypdf, via our own ingest/parsers/pdf.py. NOT via
#                       unstructured: its PDF path imports unstructured_inference
#                       (onnxruntime/opencv/torch, ~2.5 GB) at module scope even
#                       for text-only extraction, and fetches ONNX layout weights
#                       over the network on first parse.
# text/plain, text/markdown and text/html need no extra packages.
app = [
    "fastapi>=0.112", "uvicorn>=0.30", "pyjwt[crypto]>=2.9", "arq>=0.26",
    "python-multipart>=0.0.9",
    "unstructured>=0.15", "pypdf>=4.2", "python-docx>=1.1",
]
obs = ["langfuse>=4"]
# Optional: real redis-vl backend for the semantic cache (Redis 8). Lazily
# imported (cache/_redisvl_backend.py only) so the offline suite and lint stay
# dependency-free; install with `uv sync --extra cache` to enable it.
cache = ["redisvl>=0.3"]
# Optional: cross-check our native RAGAS-style metrics against the real library.
# Not part of the core/CI path (the native metrics are the spine); install with
# `uv sync --extra ragas` to enable eval/ragas_adapter.py.
ragas = ["ragas>=0.4", "langchain-openai>=0.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.23", "ruff>=0.6"]
all = [
    "datasets>=2.20", "scipy>=1.13", "pandas>=2.2",
    "sentence-transformers>=3.0",
    "fastapi>=0.112", "uvicorn>=0.30", "pyjwt[crypto]>=2.9", "arq>=0.26",
    "python-multipart>=0.0.9",
    "unstructured>=0.15", "pypdf>=4.2", "python-docx>=1.1",
    "langfuse>=4",
    "redisvl>=0.3",
    "pytest>=8.3", "pytest-asyncio>=0.23", "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "providers", "ingest", "corpora", "retrieval", "generation", "guardrails", "eval", "observability", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
